<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE CAGE v0.2</title><style>
:root{--bg:#08111b;--panel:#102131;--line:#2a4458;--ink:#edf6fb;--muted:#9ab0c0;--green:#6ce0b3;--orange:#ffb86b;--red:#ff7890}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#1b3d52,#08111b 58%);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px 18px 60px}h1{font-size:clamp(32px,6vw,64px);letter-spacing:.1em;margin:0}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.lede,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#102131e8;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 35px #0004}.side{border-top:3px solid var(--green)}.side.b{border-color:var(--orange)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}input,select,button{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#091722;color:var(--ink);font:inherit}button{background:linear-gradient(135deg,#17694f,#19506c);border:0;font-weight:700;cursor:pointer;margin-top:10px}button.secondary{background:#203445}button:focus,input:focus,select:focus{outline:2px solid var(--green);outline-offset:2px}.slot{border:1px solid #2a4458;border-radius:10px;padding:10px;margin:10px 0}.status{min-height:20px;margin-top:6px}.ok{color:var(--green)}.bad{color:var(--red)}.identity{margin-top:8px;background:#0b1a27;padding:8px;border-radius:8px}.actions{display:flex;gap:10px}.actions>*{flex:1}.hidden{display:none}.score{text-align:center;font-size:54px;font-weight:800;margin:10px}.score span:first-child{color:var(--green)}.score span:last-child{color:var(--orange)}ol{max-height:360px;overflow:auto;margin:8px 0;padding-left:25px}li{padding:6px 0;border-bottom:1px solid #ffffff10}.bar{height:8px;background:#294052;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.b .bar i{background:var(--orange)}@media(max-width:760px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head><body><main><div class="eyebrow">Prototype 0.2 · memory-first football recall</div><h1>THE CAGE</h1><p class="lede">Remember three footballers. Type their names. Search only when you are ready. There is no roster to browse.</p><section class="grid"><div class="panel side"><h2>COMMANDER</h2><div id="aSlots"></div><button id="lockA">Lock Commander trio</button><label for="ta">Tactic</label><select id="ta"><option value="balanced">Balanced</option><option value="press">High press</option><option value="possession">Possession</option><option value="counter">Counterattack</option></select></div><div class="panel side b"><h2>OPPONENT</h2><div id="bSlots"></div><button id="lockB">Lock opponent trio</button><label for="tb">Tactic</label><select id="tb"><option value="balanced">Balanced</option><option value="press">High press</option><option value="possession">Possession</option><option value="counter">Counterattack</option></select></div></section><section class="panel" style="margin-top:16px"><div class="actions"><button id="play" disabled>Simulate match</button><button class="secondary" id="replay" disabled>Replay with new seed</button></div><p id="global" class="status" role="status"></p><div id="match" class="hidden"><div class="score"><span id="sa">0</span> — <span id="sb">0</span></div><p id="meta" class="muted" style="text-align:center"></p><div class="grid"><div><h3>Engine report</h3><div id="strengths"></div></div><div><h3>Match log</h3><ol id="log"></ol></div></div></div></section></main><script src="src/players.js"></script><script>
const LEGACY_PLAYERS=[
{id:'djalminha',name:'Djalminha',aliases:[],country:'Brazil',role:'M',r:{pace:72,tech:95,pass:91,finish:80,def:30,phys:52}},
{id:'okocha',name:'Jay-Jay Okocha',aliases:['jay jay okocha','okocha'],country:'Nigeria',role:'M',r:{pace:88,tech:94,pass:86,finish:78,def:35,phys:58}},
{id:'vidic',name:'Nemanja Vidić',aliases:['nemanja vidic','vidic'],country:'Serbia',role:'D',r:{pace:57,tech:56,pass:64,finish:34,def:96,phys:94}},
{id:'ronaldo-nazario',name:'Ronaldo Nazário',aliases:['r9','ronaldo nazario','ronaldo fenomeno'],country:'Brazil',role:'F',r:{pace:95,tech:94,pass:78,finish:97,def:20,phys:78}},
{id:'sinisa-mihajlovic',name:'Siniša Mihajlović',aliases:['sinisa mihajlovic','mihajlovic'],country:'Serbia',role:'D',r:{pace:59,tech:70,pass:88,finish:54,def:78,phys:76}},
{id:'jaap-stam',name:'Jaap Stam',aliases:['stam','jaap stam'],country:'Netherlands',role:'D',r:{pace:76,tech:58,pass:61,finish:25,def:94,phys:93}},
{id:'riquelme',name:'Juan Román Riquelme',aliases:['juan roman riquelme','riquelme'],country:'Argentina',role:'M',r:{pace:42,tech:93,pass:97,finish:79,def:28,phys:50}},
{id:'quaresma',name:'Ricardo Quaresma',aliases:['quaresma'],country:'Portugal',role:'F',r:{pace:86,tech:92,pass:78,finish:76,def:24,phys:55}},
{id:'davids',name:'Edgar Davids',aliases:['davids'],country:'Netherlands',role:'M',r:{pace:84,tech:78,pass:80,finish:55,def:82,phys:88}}
];
const PLAYERS=window.THE_CAGE_PLAYERS;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
function search(q){const n=norm(q);if(!n)return {error:'Type a footballer name before searching.'};const exact=PLAYERS.filter(p=>[p.name,...p.aliases].some(x=>norm(x)===n));if(exact.length)return {matches:exact};return {error:'Not in the pilot roster yet; no identity or ratings were invented.'}}
function rng(seed){let x=(seed>>>0)||1;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function team(ids,t){if(ids.length!==3||new Set(ids).size!==3)throw Error('Each trio needs three distinct verified players.');const ps=ids.map(id=>PLAYERS.find(p=>p.id===id));if(ps.some(p=>!p))throw Error('Unverified player in team.');const avg=k=>ps.reduce((s,p)=>s+p.r[k],0)/3, best=k=>Math.max(...ps.map(p=>p.r[k]));const role=ps.map(p=>p.role), chem=Math.max(40,Math.min(100,72+(role.includes('D')?13:0)+(role.includes('M')?8:0)+(role.every(x=>x==='F')?-15:0)));const mod={balanced:[1,1,1],press:[1.1,1.12,.82],possession:[.88,1.02,1.14],counter:[1.06,.92,.94]}[t]||[1,1,1];return {players:ps,attack:(.4*avg('finish')+.3*avg('tech')+.18*avg('pace')+.12*avg('pass'))*mod[0],defence:(.55*best('def')+.3*avg('def')+.15*avg('phys'))*mod[1],control:(.42*avg('tech')+.42*avg('pass')+.16*avg('pace'))*mod[2],chem};}
function match(a,b,ta,tb,seed){const A=team(a,ta),B=team(b,tb),R=rng(seed),score=[0,0],events=[];for(let m=1;m<=20;m++)for(let s=0;s<2;s++){const x=s?B:A,y=s?A:B,ps=s?b:a,prob=Math.max(.008,Math.min(.12,.035*(x.attack/(y.defence+1))*(x.control/(y.control+1))));const roll=R();if(roll<prob){const pickedId=ps[Math.floor(R()*3)];const scorer=PLAYERS.find(p=>p.id===pickedId).name;score[s]++;events.push(`${m}' ${scorer} scores after a ${s?'opponent':'team'} possession creates space.`)}else if(roll<prob+.07){const pickedId=ps[Math.floor(R()*3)];const attacker=PLAYERS.find(p=>p.id===pickedId);events.push(`${m}' ${attacker.name} is stopped by a timely defensive intervention.`)}}return {score,events,A,B,seed,winner:score[0]===score[1]?'Draw':score[0]>score[1]?'Commander wins':'Opponent wins'};}
function slotUI(side){const root=document.getElementById(side+'Slots');root.innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');d.className='slot';d.innerHTML=`<label for="${side}${i}">Recall player ${i+1}</label><input id="${side}${i}" autocomplete="off" placeholder="Type from memory"><button data-search="${side}${i}">Search and verify</button><div id="${side}${i}Status" class="status" role="status"></div>`;root.appendChild(d)}root.addEventListener('click',e=>{if(!e.target.dataset.search)return;const id=e.target.dataset.search,q=document.getElementById(id).value,res=search(q),out=document.getElementById(id+'Status');if(res.error){out.className='status bad';out.textContent=res.error;return}out.className='status ok';out.innerHTML='';res.matches.forEach(p=>{const b=document.createElement('button');b.textContent=`Confirm ${p.name} · ${p.country} · role ${p.role}`;b.onclick=()=>{const used=Object.values(window.teams).flat().filter(Boolean);if(used.includes(p.id)){out.className='status bad';out.textContent='Duplicate blocked: choose another remembered player.';return}window.teams[side][Number(id.slice(-1))]=p.id;out.innerHTML=`<div class="identity"><b>Verified: ${p.name}</b><br><span class="muted">${p.country} · editorial role ${p.role}</span><br><small>Attack ${p.r.finish} · Control ${p.r.pass} · Defence ${p.r.def} · Pace ${p.r.pace} · Technique ${p.r.tech} · Strength ${p.r.phys}</small></div>`;document.getElementById(id).disabled=true;b.remove()};out.appendChild(b)})})}
window.teams={a:[],b:[]};slotUI('a');slotUI('b');let locked={a:false,b:false},last;
function lock(side){if(window.teams[side].filter(Boolean).length!==3){document.getElementById('global').textContent='Search and explicitly confirm three distinct players first.';document.getElementById('global').className='status bad';return}locked[side]=true;document.getElementById('lock'+(side==='a'?'A':'B')).disabled=true;document.getElementById('global').textContent=(side==='a'?'Commander':'Opponent')+' trio locked.';play.disabled=!(locked.a&&locked.b);}
lockA.onclick=()=>lock('a');lockB.onclick=()=>lock('b');function render(replay=false){last=match(window.teams.a,window.teams.b,ta.value,tb.value,replay?Math.floor(Math.random()*2**32):Date.now());sa.textContent=last.score[0];sb.textContent=last.score[1];meta.textContent=`${last.winner} · seed ${last.seed} · deterministic engine v0.2`;log.innerHTML=last.events.map(x=>`<li>${x}</li>`).join('')||'<li>0–0: disciplined defensive match.</li>';strengths.innerHTML=[last.A,last.B].map((x,i)=>`<div class="slot"><b>${i?'Opponent':'Commander'}</b><br><span class="muted">Attack ${x.attack.toFixed(0)} · Defence ${x.defence.toFixed(0)} · Control ${x.control.toFixed(0)} · Chemistry ${x.chem}</span><div class="bar"><i style="width:${Math.min(100,x.attack)}%"></i></div></div>`).join('');document.getElementById('match').classList.remove('hidden');document.getElementById('replay').disabled=false}play.onclick=()=>render(false);replay.onclick=()=>render(true);
</script></body></html>
