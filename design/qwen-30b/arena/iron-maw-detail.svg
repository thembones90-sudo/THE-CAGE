<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="650" height="380" role="img" aria-labelledby="goalTitle goalDesc">
<title id="goalTitle">The Iron Maw steel-chain net detail</title><desc id="goalDesc">Close view of reinforced gunmetal goalposts and hanging interlinked steel chain net, originally designed for THE CAGE arena.</desc>
<defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d20"/><stop offset=".5" stop-color="#25363a"/><stop offset="1" stop-color="#091014"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef5f3"/><stop offset=".14" stop-color="#82989c"/><stop offset=".41" stop-color="#38484f"/><stop offset=".8" stop-color="#18262b"/><stop offset="1" stop-color="#83979b"/></linearGradient>
<linearGradient id="chainshine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fcfa"/><stop offset=".35" stop-color="#c8d9d5"/><stop offset=".64" stop-color="#617980"/><stop offset="1" stop-color="#deedea"/></linearGradient>
<pattern id="chains" width="35" height="42" patternUnits="userSpaceOnUse">
 <g fill="none" stroke-linecap="round"><ellipse cx="12" cy="9" rx="8" ry="14" transform="rotate(-30 12 9)" stroke="#02070b" stroke-width="7.8"/><ellipse cx="12" cy="9" rx="8" ry="14" transform="rotate(-30 12 9)" stroke="url(#chainshine)" stroke-width="4.8"/>
 <ellipse cx="30" cy="29" rx="8" ry="14" transform="rotate(30 30 29)" stroke="#02070b" stroke-width="7.8"/><ellipse cx="30" cy="29" rx="8" ry="14" transform="rotate(30 30 29)" stroke="url(#chainshine)" stroke-width="4.8"/>
 <path d="M9 1l5 3M28 20l6 2" stroke="#fff" stroke-width="1.1" opacity=".9"/></g>
</pattern>
<pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#718a8d" stroke-width="1.5" opacity=".2"/></pattern>
<radialGradient id="light"><stop stop-color="#dceeed" stop-opacity=".19"/><stop offset="1" stop-color="#e9eeee" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dx="2" dy="7"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="650" height="380" rx="7" fill="#070c0f"/>
<rect x="10" y="10" width="630" height="360" rx="7" fill="url(#back)" stroke="#53686e" stroke-width="2"/>
<rect x="23" y="23" width="604" height="334" fill="url(#hatch)" stroke="#344951" stroke-width="1.5"/>
<ellipse cx="320" cy="152" rx="255" ry="145" fill="url(#light)"/>
<!-- Heavy gunmetal goal mouth and ring chains are separate named vector groups. -->
<g id="chain-backplate" filter="url(#shadow)">
<rect x="93" y="48" width="462" height="286" rx="9" fill="#071217" stroke="#101b21" stroke-width="22"/>
<rect x="105" y="59" width="440" height="266" fill="#25373c" stroke="#768990" stroke-width="3"/>
<rect x="110" y="63" width="430" height="258" fill="url(#chains)"/>
<path d="M110 63L540 321M110 321L540 63" stroke="#e1f1eb" stroke-width="2" opacity=".12"/>
</g>
<g id="steel-goal-frame" filter="url(#shadow)">
<path d="M93 332V48H555V332" fill="none" stroke="#050a0d" stroke-width="29"/>
<path d="M93 332V48H555V332" fill="none" stroke="url(#metal)" stroke-width="23"/>
<path d="M98 326V53H549V326" fill="none" stroke="#d8e6e4" stroke-width="3.5"/>
<path d="M113 68H531" stroke="#080f12" stroke-width="6" opacity=".7"/>
<g fill="#223139" stroke="#b7caca" stroke-width="2">
 <rect x="78" y="43" width="31" height="28" rx="4"/><rect x="538" y="43" width="33" height="28" rx="4"/>
 <rect x="78" y="314" width="31" height="28" rx="4"/><rect x="538" y="314" width="33" height="28" rx="4"/>
</g>
<g fill="#172228" stroke="#879da2" stroke-width="1.6"><circle cx="93" cy="57" r="5"/><circle cx="554" cy="57" r="5"/><circle cx="93" cy="328" r="5"/><circle cx="554" cy="328" r="5"/></g>
<g stroke="#d3e0de" stroke-width="2.5"><path d="M90 55l6 5m-6 0l6-5M551 55l6 5m-6 0l6-5M90 326l6 5m-6 0l6-5M551 326l6 5m-6 0l6-5"/></g>
</g>
<g font-family="Arial,sans-serif" letter-spacing="3" font-weight="bold">
<rect x="205" y="19" width="240" height="31" rx="3" fill="#132329" stroke="#8a9b9d" stroke-width="1.3"/>
<text x="325" y="40" fill="#dbe4e2" font-size="14" text-anchor="middle">THE IRON MAW</text>
<path d="M112 348H539" stroke="#a7bdbe" opacity=".4"/>
<text x="325" y="360" fill="#c6ad74" font-size="11" text-anchor="middle">REINFORCED STEEL · CHAIN-LINKED</text>
